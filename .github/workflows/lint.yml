name: "Lint"

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Set up Python"
          uses: actions/setup-python@v7.1.0
          with:
            python-version: "3.13"

        # Only ruff is needed here; pin it to the version in requirements.txt
        # instead of installing all of Home Assistant.
        - name: "Install ruff"
          run: python3 -m pip install "$(grep '^ruff==' requirements.txt)"

        - name: "Run"
          run: python3 -m ruff check .
